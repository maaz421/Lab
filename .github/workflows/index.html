<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0F1B14;
    color: #EDE7DA;
    font-family: 'IBM Plex Mono', monospace;
  }
  .font-display { font-family: 'Fraunces', serif; }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 24px;
  }
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid #2C3B2F;
    padding-bottom: 32px;
    margin-bottom: 48px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #B8A46A;
    margin: 0 0 12px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 36px;
    color: #F6F2E7;
    margin: 0;
  }
  .btn-primary {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #B8A46A;
    color: #0F1B14;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    border: none;
    padding: 12px 20px;
    border-radius: 2px;
    cursor: pointer;
  }
  .btn-primary:hover { background: #CBB87E; }

  .empty {
    border: 1px dashed #2C3B2F;
    border-radius: 2px;
    padding: 80px 20px;
    text-align: center;
  }
  .empty p.title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: #C9C2AE;
    margin: 0 0 4px;
  }
  .empty p.sub {
    font-size: 12px;
    color: #6B7A6E;
    margin: 0;
  }

  ul#file-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid #2C3B2F;
    border-bottom: 1px solid #2C3B2F;
  }
  ul#file-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid #2C3B2F;
  }
  ul#file-list li:last-child { border-bottom: none; }
  .file-info {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }
  .file-index {
    font-size: 12px;
    color: #5E6E62;
    width: 24px;
    flex-shrink: 0;
  }
  .file-name {
    font-family: sans-serif;
    font-size: 14px;
    color: #F6F2E7;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-size {
    font-size: 11px;
    color: #6B7A6E;
    margin: 2px 0 0;
  }
  .file-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .btn-download {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 2px;
    border: 1px solid #3C4D40;
    background: transparent;
    color: #EDE7DA;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }
  .btn-download:hover { border-color: #B8A46A; color: #B8A46A; }
  .btn-remove {
    background: transparent;
    border: none;
    color: #5E6E62;
    cursor: pointer;
    padding: 8px;
  }
  .btn-remove:hover { color: #D97757; }

  /* Dialog */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .dialog {
    background: #16241A;
    border: 1px solid #2C3B2F;
    border-radius: 2px;
    width: 100%;
    max-width: 380px;
    padding: 24px;
  }
  .dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .dialog-header h2 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: #F6F2E7;
    margin: 0;
  }
  .dialog-close {
    background: none;
    border: none;
    color: #5E6E62;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }
  .dialog-close:hover { color: #EDE7DA; }

  .drop-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    border: 1px dashed #3C4D40;
    border-radius: 2px;
    padding: 40px 16px;
    cursor: pointer;
    margin-bottom: 20px;
    text-align: center;
  }
  .drop-label:hover { border-color: #B8A46A; }
  .drop-label .upload-icon { font-size: 22px; color: #B8A46A; }
  .drop-label .pick-text { font-size: 12px; color: #C9C2AE; }
  .drop-label .pick-size { font-size: 11px; color: #6B7A6E; }

  .dialog-actions { display: flex; gap: 12px; }
  .btn-secondary, .btn-upload {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 12px;
    border-radius: 2px;
    cursor: pointer;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid #3C4D40;
    color: #C9C2AE;
  }
  .btn-secondary:hover { border-color: #5E6E62; }
  .btn-upload {
    background: #B8A46A;
    border: none;
    color: #0F1B14;
    font-weight: 500;
  }
  .btn-upload:hover { background: #CBB87E; }
  .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <p class="eyebrow">Deposit &amp; retrieval</p>
      <h1>File Vault</h1>
    </div>
    <button class="btn-primary" id="add-btn">+ Add new file</button>
  </div>

  <div id="empty-state" class="empty">
    <p class="title">The vault is empty</p>
    <p class="sub">Add a file to deposit it here for download later.</p>
  </div>

  <ul id="file-list" style="display:none;"></ul>
</div>

<!-- Dialog -->
<div class="overlay" id="overlay">
  <div class="dialog">
    <div class="dialog-header">
      <h2>Add a file</h2>
      <button class="dialog-close" id="close-btn">&times;</button>
    </div>

    <label class="drop-label" for="file-input">
      <div class="upload-icon">&#8593;</div>
      <span class="pick-text" id="pick-text">Choose a file from your device</span>
      <span class="pick-size" id="pick-size"></span>
      <input type="file" id="file-input" style="display:none;">
    </label>

    <div class="dialog-actions">
      <button class="btn-secondary" id="cancel-btn">Cancel</button>
      <button class="btn-upload" id="upload-btn" disabled>Upload</button>
    </div>
  </div>
</div>

<script>
  let files = []; // { id, name, size, url }
  let pendingFile = null;

  const addBtn = document.getElementById('add-btn');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('close-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const fileInput = document.getElementById('file-input');
  const pickText = document.getElementById('pick-text');
  const pickSize = document.getElementById('pick-size');
  const uploadBtn = document.getElementById('upload-btn');
  const fileList = document.getElementById('file-list');
  const emptyState = document.getElementById('empty-state');

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function openDialog() {
    pendingFile = null;
    fileInput.value = '';
    pickText.textContent = 'Choose a file from your device';
    pickSize.textContent = '';
    uploadBtn.disabled = true;
    overlay.classList.add('open');
  }

  function closeDialog() {
    overlay.classList.remove('open');
  }

  addBtn.addEventListener('click', openDialog);
  closeBtn.addEventListener('click', closeDialog);
  cancelBtn.addEventListener('click', closeDialog);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDialog(); });

  fileInput.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) {
      pendingFile = f;
      pickText.textContent = f.name;
      pickSize.textContent = formatSize(f.size);
      uploadBtn.disabled = false;
    }
  });

  uploadBtn.addEventListener('click', () => {
    if (!pendingFile) return;
    const url = URL.createObjectURL(pendingFile);
    files.unshift({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      name: pendingFile.name,
      size: pendingFile.size,
      url: url
    });
    renderList();
    closeDialog();
  });

  function renderList() {
    if (files.length === 0) {
      emptyState.style.display = 'block';
      fileList.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    fileList.style.display = 'block';
    fileList.innerHTML = '';

    files.forEach((entry, i) => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="file-info">
          <span class="file-index">${String(files.length - i).padStart(2, '0')}</span>
          <div>
            <p class="file-name">${entry.name}</p>
            <p class="file-size">${formatSize(entry.size)}</p>
          </div>
        </div>
        <div class="file-actions">
          <button class="btn-download" data-id="${entry.id}">&#8595; Download</button>
          <button class="btn-remove" data-id="${entry.id}">&times;</button>
        </div>
      `;
      fileList.appendChild(li);
    });

    fileList.querySelectorAll('.btn-download').forEach(btn => {
      btn.addEventListener('click', () => downloadFile(btn.dataset.id));
    });
    fileList.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', () => removeFile(btn.dataset.id));
    });
  }

  function downloadFile(id) {
    const entry = files.find(f => f.id === id);
    if (!entry) return;
    const a = document.createElement('a');
    a.href = entry.url;
    a.download = entry.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function removeFile(id) {
    const entry = files.find(f => f.id === id);
    if (entry) URL.revokeObjectURL(entry.url);
    files = files.filter(f => f.id !== id);
    renderList();
  }
</script>

</body>
</html>
