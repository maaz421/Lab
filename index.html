<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Vault - Downloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0F1B14;
    color: #EDE7DA;
    font-family: 'IBM Plex Mono', monospace;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 24px;
  }
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid #2C3B2F;
    padding-bottom: 32px;
    margin-bottom: 48px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #B8A46A;
    margin: 0 0 12px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 36px;
    color: #F6F2E7;
    margin: 0;
  }
  .empty {
    border: 1px dashed #2C3B2F;
    border-radius: 2px;
    padding: 80px 20px;
    text-align: center;
  }
  .empty p.title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: #C9C2AE;
    margin: 0 0 4px;
  }
  .empty p.sub {
    font-size: 12px;
    color: #6B7A6E;
    margin: 0;
  }
  ul#file-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid #2C3B2F;
    border-bottom: 1px solid #2C3B2F;
  }
  ul#file-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid #2C3B2F;
  }
  ul#file-list li:last-child { border-bottom: none; }
  .file-info {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }
  .file-index {
    font-size: 12px;
    color: #5E6E62;
    width: 24px;
    flex-shrink: 0;
  }
  .file-name {
    font-family: sans-serif;
    font-size: 14px;
    color: #F6F2E7;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-size {
    font-size: 11px;
    color: #6B7A6E;
    margin: 2px 0 0;
  }
  .btn-download {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 2px;
    border: 1px solid #3C4D40;
    background: transparent;
    color: #EDE7DA;
    cursor: pointer;
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
  }
  .btn-download:hover { border-color: #B8A46A; color: #B8A46A; }
  .status {
    font-size: 12px;
    color: #6B7A6E;
    margin: 0 0 20px;
  }
  .status.error { color: #D97757; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <p class="eyebrow">Public Vault</p>
      <h1>Available Files</h1>
    </div>
  </div>

  <p class="status" id="status-line">Loading files&hellip;</p>

  <div id="empty-state" class="empty" style="display:none;">
    <p class="title">The vault is empty</p>
    <p class="sub">No files are available for download right now.</p>
  </div>

  <ul id="file-list" style="display:none;"></ul>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://xzuvkuyghszahailczae.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ON79vUDD81HPF0wqZdq7Ew_25pxAeOO';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const fileList = document.getElementById('file-list');
  const emptyState = document.getElementById('empty-state');
  const statusLine = document.getElementById('status-line');

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  async function loadFiles() {
    try {
      statusLine.textContent = 'Loading files…';
      statusLine.className = 'status';

      const { data, error } = await supabase
        .from('files')
        .select('*')
        .order('id', { ascending: false });

      if (error) throw error;

      renderList(data || []);
      statusLine.textContent = '';
    } catch (err) {
      statusLine.textContent = 'Error loading files: ' + err.message;
      statusLine.className = 'status error';
      renderList([]);
    }
  }

  function renderList(files) {
    if (files.length === 0) {
      emptyState.style.display = 'block';
      fileList.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    fileList.style.display = 'block';
    fileList.innerHTML = '';

    files.forEach((entry, i) => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="file-info">
          <span class="file-index">${String(files.length - i).padStart(2, '0')}</span>
          <div>
            <p class="file-name">${entry.originalName}</p>
            <p class="file-size">${formatSize(entry.size)}</p>
          </div>
        </div>
        <div>
          <a class="btn-download" href="${entry.downloadUrl}" target="_blank" rel="noopener">&#8595; Download</a>
        </div>
      `;
      fileList.appendChild(li);
    });
  }

  loadFiles();
</script>

</body>
</html>
